<header class="cabecera">
  <a class="marca" routerLink="/" aria-label="Boletería de parques, ir al inicio">
    <span class="marca-sello" aria-hidden="true"></span>
    Boletería
  </a>
  <nav class="cabecera-personal" aria-label="Personal">
    @if (auth.sesion(); as s) {
      @if (s.rol === 'ADMIN') {
        <a routerLink="/admin">Administración</a>
      }
      <a routerLink="/puerta">Puerta</a>
      <span class="usuario">{{ s.usuario }}</span>
      <button type="button" class="enlace" (click)="salir()">Salir</button>
    } @else {
      <a routerLink="/acceso">Personal</a>
    }
  </nav>
</header>
<router-outlet />
