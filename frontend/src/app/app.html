<header class="cabecera">
  <a class="marca" routerLink="/" aria-label="Boletería de parques, ir al inicio">
    <span class="marca-sello" aria-hidden="true"></span>
    Boletería
  </a>
  <nav class="cabecera-personal" aria-label="Principal">
    @if (auth.sesion(); as s) {
      @switch (s.rol) {
        @case ('ADMIN') {
          <a routerLink="/admin">Administración</a>
          <a routerLink="/puerta">Puerta</a>
          <a routerLink="/comprar">Comprar</a>
        }
        @case ('PUERTA') {
          <a routerLink="/puerta">Puerta</a>
        }
        @default {
          <a routerLink="/comprar">Comprar</a>
          <a routerLink="/perfil">Mi perfil</a>
        }
      }
      <span class="usuario">{{ s.nombre }}</span>
      <button type="button" class="enlace" (click)="salir()">Salir</button>
    } @else {
      <a routerLink="/acceso">Iniciar sesión</a>
      <a class="boton-cabecera" routerLink="/acceso" [queryParams]="{ crear: 1 }">Crear cuenta</a>
    }
  </nav>
</header>
<router-outlet />
