# Integracion continua: en cada push y pull request compila y corre TODOS los tests (unitarios, arquitectura con
# ArchUnit, persistencia, concurrencia y API). Los tests usan H2 en memoria, asi que no necesitan base de datos
# ni secretos.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El workflow solo necesita leer el codigo (principio de minimo privilegio)
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, cancela la ejecucion anterior que sigue en curso
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Compilar y probar (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 21 (con cache de Maven)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y correr los tests
        run: mvn --batch-mode --no-transfer-progress verify

      # Si algo falla, guarda los reportes para poder ver el detalle sin reproducirlo en tu PC
      - name: Guardar reportes de los tests (solo si fallan)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire
          path: target/surefire-reports
          retention-days: 7

  # Comprueba que el Dockerfile y el docker-compose funcionan: construye la imagen, levanta la API con PostgreSQL
  # y verifica que el administrador inicial puede iniciar sesion (eso prueba base de datos, migraciones y JWT).
  docker:
    name: Imagen Docker y docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Crear .env de prueba (valores solo para CI, no son secretos reales)
        run: |
          printf 'DB_PASSWORD=clave-solo-para-ci\n' > .env
          printf 'JWT_SECRET=secreto-solo-para-ci-0123456789-abcdefghijklmnop\n' >> .env
          printf 'ADMIN_PASSWORD=admin-solo-para-ci-123\n' >> .env

      - name: Construir y levantar con docker compose
        run: docker compose up --build -d

      - name: Esperar a la API y probar el login del administrador
        run: |
          codigo=000
          for i in $(seq 1 40); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"usuario":"admin","clave":"admin-solo-para-ci-123"}' || true)
            [ "$codigo" = "200" ] && break
            sleep 3
          done
          echo "Respuesta final del login: $codigo"
          test "$codigo" = "200"

      - name: Mostrar logs si algo fallo
        if: failure()
        run: docker compose logs --no-color

      - name: Apagar y limpiar
        if: always()
        run: docker compose down -v

  # Compila la aplicacion Angular (instala exactamente lo que dice package-lock.json y genera el build de produccion).
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js 22 (con cache de npm)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar para produccion
        run: npm run build
