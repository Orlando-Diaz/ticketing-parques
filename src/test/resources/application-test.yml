# Perfil "test": los tests usan una base H2 en memoria (con las mismas migraciones de Flyway),
# asi corren sin necesitar PostgreSQL ni contrasenas.
spring:
  datasource:
    url: jdbc:h2:mem:ticketing;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

# El programador del outbox se apaga en los tests: la entrega inmediata tras confirmar la transaccion basta,
# y asi cada test decide cuando llamar al despachador.
ticketing:
  outbox:
    programador-activo: false
  # Valores SOLO de pruebas (la base es H2 en memoria; no protegen nada real).
  seguridad:
    jwt-secreto: secreto-solo-para-pruebas-0123456789-abcdefghij
    admin-usuario: admin
    admin-clave: clave-de-pruebas-123
