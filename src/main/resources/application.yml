spring:
  application:
    name: ticketing-parques

  # Las credenciales NUNCA van en el codigo: se leen de variables de entorno.
  # DB_PASSWORD no tiene valor por defecto a proposito: si falta, la app no arranca y te lo dice.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketing_parques}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Hibernate NO crea tablas: solo verifica que coincidan con las migraciones de Flyway

ticketing:
  seguridad:
    # Sin valor por defecto a proposito (como DB_PASSWORD): al menos 32 caracteres aleatorios.
    jwt-secreto: ${JWT_SECRET}
    token-minutos: 60
    # El administrador inicial se crea al arrancar solo si defines ADMIN_PASSWORD (min. 10 caracteres).
    admin-usuario: ${ADMIN_USER:admin}
    admin-clave: ${ADMIN_PASSWORD:}

server:
  port: 8080
