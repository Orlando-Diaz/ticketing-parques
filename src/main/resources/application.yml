spring:
  application:
    name: ticketing-parques

  # Las credenciales NUNCA van en el codigo: se leen de variables de entorno.
  # DB_PASSWORD no tiene valor por defecto a proposito: si falta, la app no arranca y te lo dice.
  datasource:
    # DB_URL completa (local/Docker) o, si no esta, se arma con DB_HOST, DB_PORT y DB_NAME (como los entrega Render)
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketing_parques}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Hibernate NO crea tablas: solo verifica que coincidan con las migraciones de Flyway

ticketing:
  seguridad:
    # Sin valor por defecto a proposito (como DB_PASSWORD): al menos 32 caracteres aleatorios.
    jwt-secreto: ${JWT_SECRET}
    token-minutos: 60
    # El administrador inicial se crea al arrancar solo si defines ADMIN_PASSWORD (min. 10 caracteres).
    admin-usuario: ${ADMIN_USER:admin}
    admin-clave: ${ADMIN_PASSWORD:}
  correo:
    # Sin MAIL_USER y MAIL_PASSWORD el correo no se envia: se escribe en el log. Para Gmail usa una "contrasena de
    # aplicacion" (no tu clave normal) y NUNCA la pongas en el codigo.
    host: ${MAIL_HOST:smtp.gmail.com}
    puerto: ${MAIL_PORT:587}
    usuario: ${MAIL_USER:}
    clave: ${MAIL_PASSWORD:}
    remitente: ${MAIL_FROM:}
    # Si se define, el correo sale por la API HTTPS de Brevo en vez de SMTP (para hostings que bloquean SMTP)
    brevo-clave: ${BREVO_API_KEY:}
  frontend:
    # Direccion publica del frontend: los correos enlazan a ella
    url: ${FRONTEND_URL:http://localhost:4200}
  cors:
    # Origenes (paginas web) autorizados a llamar a la API desde el navegador, separados por coma
    origenes: ${CORS_ORIGENES:http://localhost:4200}

server:
  port: ${PORT:8080}   # las plataformas (Render, Railway...) indican el puerto con la variable PORT
